set_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: airversa_diffuser
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 5
          mode: box
    enabled:
      selector:
        boolean:
    start:
      selector:
        time:
    end:
      selector:
        time:
    days:
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    mist:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    pause:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    intensity:
      selector:
        number:
          min: 1
          max: 9
          mode: box
